<title>Trader With Gautam Jha</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif}
body{background:radial-gradient(ellipse at 50% 25%,#0b2931 0%,#030e15 48%,#010508 100%);color:#f5fbff;display:flex;justify-content:center;align-items:center;padding:24px 24px}
.panel{width:100%;max-width:390px;padding:22px 21px 20px;background:linear-gradient(155deg,rgba(8,30,40,.96),rgba(2,12,20,.98) 65%);border:1.5px solid #15c9df;border-radius:34px;box-shadow:0 0 24px #00d9ef1a,inset 0 0 32px #0ca8b30a;text-align:center;position:relative;overflow:hidden}
.panel:before{content:'';position:absolute;inset:0 0 auto;height:125px;background:radial-gradient(ellipse at top,#10b7c41c,transparent 75%);pointer-events:none}
.avatar{position:relative;width:116px;height:116px;object-fit:cover;object-position:center 38%;border-radius:50%;border:3px solid #25d8ed;box-shadow:0 0 0 5px #0d53624d,0 0 25px #03d2f27a}
h1{font-size:clamp(20px,5.4vw,25px);line-height:1.18;letter-spacing:.5px;margin:17px 0 6px;font-weight:800}
.subtitle{font-size:11px;letter-spacing:2.5px;color:#6ed7e2;font-weight:700;margin:0 0 13px}
.divider{height:1px;background:linear-gradient(90deg,transparent,#19c2d55a,transparent);margin-bottom:5px}
.features{text-align:left;margin:0 0 12px}
.feature{display:flex;align-items:center;gap:13px;padding:11px 3px;border-bottom:1px solid #b8f6ff16;font-size:14px;color:#d7e6eb;line-height:1.35}
.feature:last-child{border:0}
.symbol{width:28px;text-align:center;font-size:20px;flex:none}
.intro{font-size:12.5px;color:#a6bac2;margin:5px 0 14px;line-height:1.5}
.join{display:flex;align-items:center;justify-content:center;gap:12px;min-height:54px;border-radius:17px;background:linear-gradient(100deg,#02c9e3,#168df2 57%,#7550ed);color:white;text-decoration:none;font-weight:800;font-size:17px;box-shadow:0 8px 25px #00bdfb38;transition:transform .2s,filter .2s}
.join:hover{filter:brightness(1.1);transform:translateY(-2px)}
.join svg{width:24px;height:24px;fill:currentColor}
.quote{font-size:12px;color:#a2bbc3;margin:14px 0 0;line-height:1.6}
@media(max-width:380px){body{padding:12px 19px}
.panel{padding:18px 18px;border-radius:24px}
.avatar{width:106px;height:106px}
.feature{padding:11px 2px;font-size:13px}
.join{min-height:53px}
}
@media(max-height:750px){body{align-items:flex-start}
.panel{padding-top:17px;padding-bottom:17px}
.avatar{width:104px;height:104px}
h1{margin-top:13px}
.subtitle{margin-bottom:12px}
.feature{padding:10px 3px}
.intro{margin:5px 0 12px}
.quote{margin-top:12px}
}
body { min-height: 100vh; min-height: 100svh; }
</style>

        tracking_id: trackingId,
        landing_page: window.location.href,
        referrer: document.referrer || '',
        fbclid: params.get('fbclid') || '',
        fbc: params.get('fbc') || getCookie('_fbc'),
        fbp: params.get('fbp') || getCookie('_fbp'),
        utm_source: params.get('utm_source') || '',
        utm_medium: params.get('utm_medium') || '',
        utm_campaign: params.get('utm_campaign') || '',
        utm_content: params.get('utm_content') || '',
        utm_term: params.get('utm_term') || '',
        campaign_id: params.get('campaign_id') || '',
        adset_id: params.get('adset_id') || '',
        ad_id: params.get('ad_id') || '',
        captured_at: new Date().toISOString()
      };

      try {
        sessionStorage.setItem('landing_attribution', JSON.stringify(attribution));
        sessionStorage.setItem('landing_utm', JSON.stringify(attribution));
      } catch (e) {}

      telegramButton.addEventListener('click', function () {
        // Record the click locally for the future Telegram join-matching backend.
        // No Meta Subscribe event is fired here in the new setup.
        try {
          sessionStorage.setItem('telegram_click', JSON.stringify({
            tracking_id: trackingId,
            clicked_at: new Date().toISOString(),
            destination: 'telegram',
            attribution: attribution
          }));
        } catch (e) {}
      }, { passive: true });
    })();
  </script>
<script src="/landing-page-patch.js"></script>
</body>
</html>
